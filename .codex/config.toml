approval_policy = "on-request"

web_search = "cached"
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
service_tier = "default"
personality = "pragmatic"

default_permissions = "workspace-only"

[permissions.workspace-only]
extends = ":workspace"

[permissions.workspace-only.filesystem]
":root" = "read"
":minimal" = "read"
"/home/gbi/.cache/go-build" = "write"
"/home/gbi/.cache/golangci-lint" = "write"

[permissions.workspace-only.network]
enabled = true

[shell_environment_policy]
inherit = "core"
include_only = ["PATH", "HOME", "USER", "SHELL", "LANG", "LC_ALL", "TERM"]

[tui]
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-remaining", "weekly-limit", "five-hour-limit"]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "bel"
notification_condition = "unfocused"
status_line_use_colors = true

[features]
apps = false
guardian_approval = false
prevent_idle_sleep = false
